<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Circle Radial Gradient -->
    <radialGradient id="favBadgeGrad" cx="50%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#142444" />
      <stop offset="35%" stop-color="#0E1930" />
      <stop offset="70%" stop-color="#080F1E" />
      <stop offset="100%" stop-color="#040812" />
    </radialGradient>

    <!-- Subtle Edge Outer Ring Gradient -->
    <linearGradient id="favEdgeRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#142442" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0A1426" stop-opacity="0.8" />
    </linearGradient>

    <!-- Left Pillar Silver-White Gradient -->
    <linearGradient id="favLeftStemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F3F6FA" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Center Diagonal Metallic Gradient -->
    <linearGradient id="favDiagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#F8FAFC" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Electric Cyan-Blue Accent Gradient (Top Right) -->
    <linearGradient id="favCyanAccentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0062FF" />
      <stop offset="40%" stop-color="#0091FF" />
      <stop offset="80%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Lower Right White Pillar Gradient -->
    <linearGradient id="favRightStemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Shadow for Depth -->
    <filter id="favShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Soft Cyan Ambient Glow for the Accent -->
    <filter id="favCyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00D2FF" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Circular Navy Emblem Background -->
  <circle cx="256" cy="256" r="242" fill="url(#favBadgeGrad)" stroke="url(#favEdgeRingGrad)" stroke-width="3.5" />

  <!-- Monogram N Shape Group Centered for Favicon -->
  <g filter="url(#favShadow)">
    <!-- LEFT VERTICAL STEM -->
    <path
      d="M 158 155
         L 158 357
         L 190 357
         L 190 224
         Z"
      fill="url(#favLeftStemGrad)"
    />

    <!-- DIAGONAL CONNECTOR -->
    <path
      d="M 158 155
         L 190 155
         L 322 330
         L 322 357
         L 289 357
         L 158 185
         Z"
      fill="url(#favDiagGrad)"
    />

    <!-- ELECTRIC BLUE TOP-RIGHT ACCENT PARALLELOGRAM -->
    <path
      d="M 296 208
         L 354 145
         L 354 180
         L 296 242
         Z"
      fill="url(#favCyanAccentGrad)"
      filter="url(#favCyanGlow)"
    />

    <!-- RIGHT LOWER WHITE PILLAR -->
    <path
      d="M 296 252
         L 354 190
         L 354 357
         L 322 357
         L 322 305
         L 296 334
         Z"
      fill="url(#favRightStemGrad)"
    />
  </g>

  <!-- Typography: NABIUL ISLAM -->
  <text
    x="256"
    y="405"
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif"
    font-size="22"
    font-weight="700"
    fill="#FFFFFF"
    letter-spacing="5.5"
    text-anchor="middle"
  >
    NABIUL ISLAM
  </text>
</svg>
