<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Circle Radial Gradient (Deep Navy to Obsidian) -->
    <radialGradient id="navyBadgeGrad" cx="50%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#142444" />
      <stop offset="35%" stop-color="#0E1930" />
      <stop offset="70%" stop-color="#080F1E" />
      <stop offset="100%" stop-color="#040812" />
    </radialGradient>

    <!-- Subtle Edge Outer Ring Gradient -->
    <linearGradient id="edgeRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D4674" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#142442" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0A1426" stop-opacity="0.7" />
    </linearGradient>

    <!-- Left Pillar Silver-White Gradient -->
    <linearGradient id="leftStemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F3F6FA" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Center Diagonal Metallic Gradient -->
    <linearGradient id="diagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#F8FAFC" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Electric Cyan-Blue Accent Gradient (Top Right) -->
    <linearGradient id="cyanAccentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0062FF" />
      <stop offset="40%" stop-color="#0091FF" />
      <stop offset="80%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Lower Right White Pillar Gradient -->
    <linearGradient id="rightStemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Shadow for Depth -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Soft Cyan Ambient Glow for the Accent -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00D2FF" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Circular Navy Emblem Background -->
  <circle cx="256" cy="256" r="240" fill="url(#navyBadgeGrad)" stroke="url(#edgeRingGrad)" stroke-width="2.5" />

  <!-- Monogram N Shape Group -->
  <g filter="url(#shadowFilter)">
    <!-- LEFT VERTICAL STEM -->
    <!-- Sharp top apex at (158, 160), down to (158, 335), with sharp diagonal facet -->
    <path
      d="M 158 160
         L 158 335
         L 189 335
         L 189 224
         Z"
      fill="url(#leftStemGrad)"
    />

    <!-- DIAGONAL CONNECTOR (Sweeps from top-left to bottom-right) -->
    <path
      d="M 158 160
         L 190 160
         L 322 308
         L 322 335
         L 289 335
         L 158 190
         Z"
      fill="url(#diagGrad)"
    />

    <!-- ELECTRIC BLUE TOP-RIGHT ACCENT PARALLELOGRAM -->
    <path
      d="M 296 211
         L 354 148
         L 354 182
         L 296 244
         Z"
      fill="url(#cyanAccentGrad)"
      filter="url(#cyanGlow)"
    />

    <!-- RIGHT LOWER WHITE PILLAR -->
    <path
      d="M 296 254
         L 354 192
         L 354 335
         L 323 335
         L 323 283
         L 296 312
         Z"
      fill="url(#rightStemGrad)"
    />
  </g>

  <!-- Typography: NABIUL ISLAM -->
  <text
    x="256"
    y="384"
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif"
    font-size="21.5"
    font-weight="700"
    fill="#FFFFFF"
    letter-spacing="5.5"
    text-anchor="middle"
  >
    NABIUL ISLAM
  </text>
</svg>
